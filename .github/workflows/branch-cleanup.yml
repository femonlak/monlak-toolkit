name: branch-cleanup
# Faxina de branches: apaga branch cujo PR fechou, avisa sobre branch esquecida.
# Regras e detalhes em ops/branch-cleanup/README.md e sweep.sh.
on:
  pull_request:
    types: [closed]
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'   # segunda 06:00 BRT
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'So listar, sem apagar'
        type: boolean
        default: false
permissions:
  contents: write
  pull-requests: read
  issues: write
concurrency:
  group: branch-cleanup
  cancel-in-progress: false
jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
      - run: bash ops/branch-cleanup/sweep.sh
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
